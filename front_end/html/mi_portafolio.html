<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>juan felipe - desarrollador</title>
    <link rel="stylesheet" href="../css/mi_portafolio.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css">
    <script src="../js/mi_portafolio.js" defer></script>
</head>
<body>
    <!----------------------------------->
    <!--|estructura_menu_de_navegacion|-->
    <!----------------------------------->
    <header>
        <nav class="navbar">
            <div class="logo">
                <img src="../img/logo.png" alt="logo">
                <span>MI PORTAFOLIO</span>
            </div>
            <ul class="nav-links">
                <li><a href="#">INICIO</a></li>
                <li><a href="#">SOBRE MI</a></li>
                <li><a href="#">CONTACTO</a></li>
                <li><a href="#">CATEGORIAS</a></li>
                <li><a href="#" class="active">STORE PROJECT</a></li>
            </ul>
            <div class="icons">
                <a href="#"><i class="fas fa-envelope"></i></a>
                <a href="#"><i class="fas fa-bell"></i></a>
                <a href="#"><i class="fas fa-user"></i></a>
            </div>
        </nav>
    </header>
    <!----------------------------->
    <!--|estructura_presentacion|-->
    <!----------------------------->
    <section class="hero">
        <div class="hero-content">
            <img src="../img/logo.png" alt="Juan Felipe" class="perfil">
            <h1>JUAN FELIPE<br>DESARROLLADOR</h1>
            <a href="#proyectos" class="btn">VER HOJA DE VIDA</a>
        </div>
    </section>
    <!------------------------------------------>
    <!--|estructura_demostracion_de_proyectos|-->
    <!------------------------------------------>
    <div class="carousel-container">
        <div class="carousel">
            <div class="card"></div>
            <div class="card"></div>
            <div class="card"></div>
            <div class="card"></div>
            <div class="card"></div>
        </div>
        <div class="controls">
            <button class="prev">&lt;</button>
            <div class="dots">
                <span class="dot active"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
            <button class="next">&gt;</button>
        </div>
    </div>

</body>
</html>
